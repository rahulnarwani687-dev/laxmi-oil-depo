<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" opacity="0.08">
  <defs>
    <pattern id="goddessPattern" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Auspicious Lotus Motif -->
      <path d="M 100,60 C 90,80 75,95 55,100 C 75,105 90,120 100,140 C 110,120 125,105 145,100 C 125,95 110,80 100,60 Z" fill="none" stroke="#f5b324" stroke-width="1.2"/>
      <circle cx="100" cy="100" r="10" fill="none" stroke="#d32f2f" stroke-width="1"/>
      
      <!-- Diya / Sacred Flame Motif -->
      <path d="M 30,30 C 25,45 35,55 45,55 C 55,55 65,45 60,30 C 55,20 45,10 45,10 C 45,10 35,20 30,30 Z" fill="none" stroke="#f5b324" stroke-width="1.2"/>
      <circle cx="45" cy="40" r="4" fill="#d32f2f"/>

      <!-- Sacred Oil Vessel & Drops -->
      <path d="M 155,150 C 145,165 135,175 135,185 A 20,20 0 0,0 175,185 C 175,175 165,165 155,150 Z" fill="none" stroke="#f5b324" stroke-width="1.2"/>
      <circle cx="155" cy="185" r="6" fill="#3b82f6"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#goddessPattern)"/>
</svg>