<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="culinaryOilSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Cap (Goddess Red with Gold Accent) -->
  <rect x="85" y="20" width="30" height="22" rx="3" fill="#d32f2f" stroke="#f5b324" stroke-width="2"/>
  <line x1="88" y1="28" x2="112" y2="28" stroke="#f5b324" stroke-width="1.2"/>
  
  <!-- Neck & Shoulder with Warm Culinary Oil inside -->
  <path d="M 88,42 L 88,75 Q 88,95 60,115 L 60,355 C 60,370 70,378 100,378 C 130,378 140,370 140,355 L 140,115 Q 112,95 112,75 L 112,42 Z" fill="url(#culinaryOilSheen)" stroke="#f5b324" stroke-width="1.8"/>

  <!-- Bottle Grip Rings -->
  <line x1="62" y1="140" x2="138" y2="140" stroke="#f5b324" stroke-width="1.2" opacity="0.6"/>
  <line x1="62" y1="150" x2="138" y2="150" stroke="#f5b324" stroke-width="1.2" opacity="0.6"/>
  <line x1="62" y1="330" x2="138" y2="330" stroke="#f5b324" stroke-width="1.2" opacity="0.6"/>

  <!-- Front Label: Deep Charcoal/Midnight & Auspicious Gold -->
  <rect x="68" y="170" width="64" height="142" rx="4" fill="#0a1322" stroke="#d32f2f" stroke-width="1.8"/>
  <rect x="71" y="173" width="58" height="136" rx="2" fill="none" stroke="#f5b324" stroke-width="0.8" stroke-dasharray="2,1"/>
  <text x="100" y="193" font-family="'Bebas Neue', sans-serif" font-size="16" font-weight="bold" fill="#f5b324" text-anchor="middle">LAXMI</text>
  <text x="100" y="206" font-family="'Inter', sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">OIL DEPO</text>
  <line x1="75" y1="213" x2="125" y2="213" stroke="#f5b324" stroke-width="0.8" stroke-dasharray="1.5,1.5"/>
  <text x="100" y="228" font-family="'Bebas Neue', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">SPECIALTY</text>
  <text x="100" y="240" font-family="'Bebas Neue', sans-serif" font-size="11" fill="#f5b324" text-anchor="middle">EDIBLE OILS</text>
  <text x="100" y="253" font-family="'Inter', sans-serif" font-size="6" fill="#fde68a" text-anchor="middle">MUSTARD · CORN</text>
  <text x="100" y="263" font-family="'Inter', sans-serif" font-size="6" fill="#fde68a" text-anchor="middle">SESAME · PALM</text>
  <rect x="76" y="278" width="48" height="18" rx="9" fill="#f5b324"/>
  <text x="100" y="291" font-family="'Inter', sans-serif" font-size="8" font-weight="bold" fill="#0a1322" text-anchor="middle">ASSORTED</text>
</svg>
