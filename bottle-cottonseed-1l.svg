<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="goldOilSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Cap (Goddess Red) -->
  <rect x="85" y="20" width="30" height="22" rx="3" fill="#d32f2f" stroke="#f5b324" stroke-width="2"/>
  
  <!-- Neck & Shoulder with Golden Oil inside -->
  <path d="M 88,42 L 88,75 Q 88,95 60,115 L 60,355 C 60,370 70,378 100,378 C 130,378 140,370 140,355 L 140,115 Q 112,95 112,75 L 112,42 Z" fill="url(#goldOilSheen)" stroke="#f5b324" stroke-width="1.8"/>

  <!-- Bottle Grip Rings -->
  <line x1="62" y1="140" x2="138" y2="140" stroke="#f5b324" stroke-width="1.2" opacity="0.6"/>
  <line x1="62" y1="150" x2="138" y2="150" stroke="#f5b324" stroke-width="1.2" opacity="0.6"/>
  <line x1="62" y1="330" x2="138" y2="330" stroke="#f5b324" stroke-width="1.2" opacity="0.6"/>

  <!-- Front Label: Deep Red & Blue -->
  <rect x="68" y="175" width="64" height="135" rx="4" fill="#0a1322" stroke="#d32f2f" stroke-width="2"/>
  <text x="100" y="200" font-family="'Bebas Neue', sans-serif" font-size="16" font-weight="bold" fill="#f5b324" text-anchor="middle">LAXMI</text>
  <text x="100" y="214" font-family="'Inter', sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">OIL DEPO</text>
  <line x1="76" y1="222" x2="124" y2="222" stroke="#f5b324" stroke-width="0.8" stroke-dasharray="1.5,1.5"/>
  <text x="100" y="238" font-family="'Bebas Neue', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle">COTTONSEED</text>
  <text x="100" y="250" font-family="'Bebas Neue', sans-serif" font-size="11" fill="#f5b324" text-anchor="middle">OIL</text>
  <rect x="76" y="270" width="48" height="18" rx="9" fill="#f5b324"/>
  <text x="100" y="283" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#0a1322" text-anchor="middle">1 LITER</text>
</svg>