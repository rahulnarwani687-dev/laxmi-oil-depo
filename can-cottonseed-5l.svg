<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 400" width="100%" height="100%">
  <defs>
    <linearGradient id="canBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#122542"/>
      <stop offset="40%" stop-color="#214275"/>
      <stop offset="70%" stop-color="#2d589c"/>
      <stop offset="100%" stop-color="#0f2038"/>
    </linearGradient>
  </defs>

  <!-- Cap (Goddess Red) -->
  <rect x="70" y="30" width="38" height="24" rx="4" fill="#d32f2f" stroke="#f5b324" stroke-width="1.8"/>
  <line x1="74" y1="38" x2="104" y2="38" stroke="#f5b324" stroke-width="1.2"/>

  <!-- Molded Handle -->
  <path d="M 125,50 C 190,48 215,50 215,120 L 215,180 C 215,200 190,195 190,175 L 190,120 C 190,80 170,80 125,80 Z" fill="#0a1322" stroke="#f5b324" stroke-width="2"/>

  <!-- Main Can Body -->
  <path d="M 50,54 L 140,54 C 150,54 220,70 230,120 L 230,360 C 230,375 215,380 200,380 L 70,380 C 55,380 45,370 45,355 L 45,70 C 45,58 48,54 50,54 Z" fill="url(#canBlue)" stroke="#f5b324" stroke-width="1.8"/>

  <!-- Ribbed Grip Lines -->
  <line x1="58" y1="120" x2="58" y2="340" stroke="#f5b324" stroke-width="1.2" opacity="0.3"/>
  <line x1="66" y1="120" x2="66" y2="340" stroke="#f5b324" stroke-width="1.2" opacity="0.3"/>

  <!-- Center Label: Goddess Red with Gold Borders -->
  <rect x="80" y="130" width="135" height="195" rx="5" fill="#d32f2f" stroke="#f5b324" stroke-width="1.8"/>
  <rect x="86" y="136" width="123" height="183" fill="none" stroke="#fde68a" stroke-width="1" stroke-dasharray="2,2"/>

  <text x="147" y="165" font-family="'Bebas Neue', sans-serif" font-size="22" font-weight="bold" fill="#f5b324" text-anchor="middle">LAXMI</text>
  <text x="147" y="180" font-family="'Inter', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">OIL DEPO</text>

  <line x1="96" y1="190" x2="198" y2="190" stroke="#f5b324" stroke-width="0.8" stroke-dasharray="2,2"/>

  <text x="147" y="215" font-family="'Bebas Neue', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">COTTONSEED OIL</text>
  <text x="147" y="235" font-family="'Inter', sans-serif" font-size="8" fill="#fde68a" text-anchor="middle">NEUTRAL &amp; CRISP FRYING</text>

  <!-- Pack Size Badge -->
  <rect x="107" y="270" width="80" height="24" rx="12" fill="#f5b324"/>
  <text x="147" y="286" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#0a1322" text-anchor="middle">5 L CAN</text>
</svg>